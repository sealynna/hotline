<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hotline</title>
    <link rel="stylesheet" href="hotline.css">
</head> 
<body>
    <div id="welcome-screen">
        <h1>Welcome to my Hotline!</h1>
        <button id="start-button">Start</button>
    </div>

    <div id="phone-screen" hidden>
        <h1>Dial a number</h1>
        <p id="message"></p>
        <p id="call-status"></p>
        <button class="number-button">1</button>
        <button class="number-button">2</button>
        <button class="number-button">3</button>
        <br>
        <button class="number-button">4</button>
        <button class="number-button">5</button>
        <button class="number-button">6</button>
        <br>
        <button class="number-button">7</button>
        <button class="number-button">8</button>
        <button class="number-button">9</button>
        <br>
        <button class="number-button">#</button>
        <button class="number-button">0</button>
        <button class="number-button">*</button>

        <br>
        <button id="back-button">Back</button>
    </div>

    <script src="hotline.js"></script>
</body>
</html>
